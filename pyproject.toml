[project]
name = "zhongshan-land-scraper"
version = "0.1.0"
description = "中山市土地交易结果公告采集"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.40.0",
    "structlog>=24.0.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "openpyxl>=3.1.5",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhongshan_land_scraper"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [".claude/**"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "G",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RUF",
]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003", "PLC2401", "PLR0912", "PLR0913", "PLR0915", "PLR0917"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-openpyxl>=3.1.5.20260724",
]
